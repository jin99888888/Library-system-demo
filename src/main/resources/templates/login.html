<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/layout :: head('登录')}"></head>
<body class="login-body">
<div class="login-wrap">
    <div class="login-card">
        <div class="login-logo">📚</div>
        <h1>图书管理系统</h1>
        <p class="sub">请使用管理员账号登录</p>

        <div class="alert err" th:if="${param.error}">用户名或密码错误</div>
        <div class="alert ok" th:if="${param.logout}">已安全退出</div>

        <form th:action="@{/login}" method="post" class="form">
            <label for="username">用户名
                <input id="username" type="text" name="username" placeholder="请输入用户名"
                       autocomplete="username" autofocus required>
            </label>
            <label for="password">密码
                <input id="password" type="password" name="password" placeholder="请输入密码"
                       autocomplete="current-password" required>
            </label>
            <button class="btn primary" type="submit">登录</button>
        </form>

        <p class="login-foot" th:text="|小型图书馆管理系统 · v${appVersion}|">小型图书馆管理系统</p>
    </div>
</div>
</body>
</html>
