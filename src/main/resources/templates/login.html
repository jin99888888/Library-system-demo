<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/layout :: head('登录')}"></head>
<body class="login-body">
<div class="login-wrap">
    <div class="login-card">
        <h1>📚 图书管理系统</h1>
        <p class="sub">请使用管理员账号登录</p>

        <div class="alert err" th:if="${param.error}">用户名或密码错误</div>
        <div class="alert ok" th:if="${param.logout}">已安全退出</div>

        <form th:action="@{/login}" method="post" class="form">
            <label>用户名
                <input type="text" name="username" autofocus required>
            </label>
            <label>密码
                <input type="password" name="password" required>
            </label>
            <button class="btn primary" type="submit">登录</button>
        </form>
    </div>
</div>
</body>
</html>
