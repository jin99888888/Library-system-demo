<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/layout :: head('概览')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('dashboard')}"></header>
<main class="container">
    <div class="page-head">
        <h1>概览</h1>
        <a class="btn primary" th:href="@{/loans/new}">+ 办理借书</a>
    </div>

    <div class="stats">
        <a class="stat" th:href="@{/books}" title="查看全部图书">
            <div class="value" th:text="${categoryCount}">0</div>
            <div class="label">书目种类</div>
        </a>
        <a class="stat" th:href="@{/books}" title="查看全部图书">
            <div class="value" th:text="${totalCopies}">0</div>
            <div class="label">藏书册数</div>
        </a>
        <a class="stat" th:href="@{/readers}" title="查看读者列表">
            <div class="value" th:text="${readerCount}">0</div>
            <div class="label">读者人数</div>
        </a>
        <a class="stat" th:href="@{/loans(status='BORROWED')}" title="查看当前借出的图书">
            <div class="value" th:text="${activeLoans}">0</div>
            <div class="label">在借册数</div>
        </a>
        <a class="stat warn" th:href="@{/loans(status='OVERDUE')}" title="查看逾期未还的记录">
            <div class="value" th:text="${overdueCount}">0</div>
            <div class="label">逾期未还</div>
        </a>
    </div>

    <div class="page-head">
        <h2 class="section-title">逾期提醒</h2>
        <a class="btn sm" th:href="@{/loans(status='OVERDUE')}">查看全部</a>
    </div>

    <table class="table">
        <thead>
        <tr>
            <th>图书</th>
            <th>读者</th>
            <th>应还时间</th>
            <th>逾期天数</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="loan : ${overdueLoans}">
            <td th:text="${loan.book.title}"></td>
            <td th:text="${loan.reader.name}"></td>
            <td th:text="${loan.dueAtText}"></td>
            <td>
                <span class="badge warn" th:text="|逾期 ${loan.overdueDays} 天|"></span>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(overdueLoans)}">
            <td colspan="4" class="empty">暂无逾期记录 🎉</td>
        </tr>
        </tbody>
    </table>

    <h2 class="section-title">快捷操作</h2>
    <a class="btn" th:href="@{/books/new}">新增图书</a>
    <a class="btn" th:href="@{/readers/new}">登记读者</a>
    <a class="btn" th:href="@{/loans/new}">借书 / 还书</a>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
