<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/layout :: head('图书')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('books')}"></header>
<main class="container">
    <div class="page-head">
        <h1>图书</h1>
        <a class="btn primary" th:href="@{/books/new}">+ 新增图书</a>
    </div>

    <div class="alert ok" th:if="${msg}" th:text="${msg}"></div>

    <form class="search" method="get" th:action="@{/books}">
        <input type="text" name="q" th:value="${q}" placeholder="按书名、作者或 ISBN 搜索">
        <input type="hidden" name="sort" th:value="${sort}">
        <input type="hidden" name="dir" th:value="${dir}">
        <button class="btn" type="submit">搜索</button>
        <a class="btn ghost" th:href="@{/books}" th:if="${!#strings.isEmpty(q)}">清空</a>
    </form>

    <div class="sort-bar" th:if="${sort != 'id'}">
        <span th:text="|当前排序：${sort == 'title' ? '书名' : '分类'} ${dir == 'asc' ? '升序' : '降序'}|"></span>
        <a class="btn ghost sm" th:href="@{/books(q=${q})}">恢复默认排序</a>
    </div>

    <table class="table">
        <thead th:with="nextTitleDir=${sort == 'title' and dir == 'asc' ? 'desc' : 'asc'},
                        nextCategoryDir=${sort == 'category' and dir == 'asc' ? 'desc' : 'asc'}">
        <tr>
            <th>
                <a class="sort" th:href="@{/books(q=${q},sort='title',dir=${nextTitleDir})}">
                    书名
                    <span class="sort-arrow"
                          th:text="${sort == 'title' ? (dir == 'asc' ? '↑' : '↓') : '↕'}"></span>
                </a>
            </th>
            <th>作者</th>
            <th>ISBN</th>
            <th>
                <a class="sort" th:href="@{/books(q=${q},sort='category',dir=${nextCategoryDir})}">
                    分类
                    <span class="sort-arrow"
                          th:text="${sort == 'category' ? (dir == 'asc' ? '↑' : '↓') : '↕'}"></span>
                </a>
            </th>
            <th>馆藏位置</th>
            <th>可借 / 总册</th>
            <th class="actions">操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="book : ${page.content}">
            <td><a th:href="@{/books/{id}(id=${book.id})}" th:text="${book.title}"></a></td>
            <td th:text="${book.author}"></td>
            <td th:text="${book.isbn ?: '—'}"></td>
            <td th:text="${book.category ?: '—'}"></td>
            <td th:text="${book.location ?: '—'}"></td>
            <td>
                <span class="badge" th:classappend="${book.availableCopies == 0} ? ' warn'"
                      th:text="|${book.availableCopies} / ${book.totalCopies}|"></span>
            </td>
            <td class="actions">
                <a class="btn sm" th:href="@{/books/{id}/edit(id=${book.id})}">编辑</a>
                <form class="inline" method="post" th:action="@{/books/{id}/delete(id=${book.id})}">
                    <button class="btn sm danger" type="submit"
                            onclick="return confirm('确定删除该图书吗？')">删除</button>
                </form>
            </td>
        </tr>
        <tr th:if="${page.totalElements == 0}">
            <td colspan="7" class="empty">还没有图书，点击右上角「新增图书」开始录入。</td>
        </tr>
        </tbody>
    </table>

    <div class="pager" th:if="${page.totalPages > 1}">
        <a class="btn sm" th:if="${page.hasPrevious}"
           th:href="@{/books(q=${q},sort=${sort},dir=${dir},page=${page.number - 1})}">上一页</a>
        <span th:text="|第 ${page.number + 1} / ${page.totalPages} 页，共 ${page.totalElements} 种|"></span>
        <a class="btn sm" th:if="${page.hasNext}"
           th:href="@{/books(q=${q},sort=${sort},dir=${dir},page=${page.number + 1})}">下一页</a>
        <form class="pager-jump" method="get" th:action="@{/books}">
            <input type="hidden" name="q" th:value="${q}">
            <input type="hidden" name="sort" th:value="${sort}">
            <input type="hidden" name="dir" th:value="${dir}">
            <label for="book-page-jump">跳至</label>
            <input class="page-input" id="book-page-jump" type="number" name="jump" min="1"
                   th:max="${page.totalPages}" th:value="${page.number + 1}" required>
            <label for="book-page-jump">页</label>
            <button class="btn sm" type="submit">跳转</button>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
