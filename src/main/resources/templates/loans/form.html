<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/layout :: head('办理借书')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('loans')}"></header>
<main class="container narrow">
    <div class="page-head">
        <h1>办理借书</h1>
        <a class="btn ghost" th:href="@{/loans}">返回借还记录</a>
    </div>

    <div class="alert err" th:if="${error}" th:text="${error}"></div>

    <div class="card">
        <form class="form" method="post" th:action="@{/loans/borrow}">
            <label>读者 <span class="req">*</span>
                <select name="readerId" required>
                    <option value="">请选择读者</option>
                    <option th:each="r : ${readers}" th:if="${!overdueReaderIds.contains(r.id)}" th:value="${r.id}"
                            th:text="|${r.name}（${r.cardNo}）|"
                            th:selected="${selectedReaderId != null and r.id == selectedReaderId}"></option>
                    <option th:each="r : ${readers}" th:if="${overdueReaderIds.contains(r.id)}" th:value="${r.id}"
                            disabled
                            th:text="|${r.name}（${r.cardNo}）· 有逾期，暂不可借|"></option>
                </select>
                <span class="hint" th:if="${!#lists.isEmpty(overdueReaderIds)}">标记为「有逾期」的读者需先归还逾期图书才能继续借书。</span>
            </label>
            <label>图书 <span class="req">*</span>
                <select name="bookId" required>
                    <option value="">请选择图书</option>
                    <option th:each="b : ${books}" th:value="${b.id}"
                            th:text="|${b.title}（可借 ${b.availableCopies} 册）|"
                            th:selected="${selectedBookId != null and b.id == selectedBookId}"></option>
                </select>
            </label>
            <p class="hint" th:if="${#lists.isEmpty(readers)}">暂无状态正常的读者，请先到「读者」页面登记读者。</p>
            <p class="hint" th:if="${#lists.isEmpty(books)}">暂无可借图书，请先到「图书」页面新增图书。</p>
            <div class="form-actions">
                <button class="btn primary" type="submit"
                        th:disabled="${#lists.isEmpty(readers) or #lists.isEmpty(books)}">确认借出</button>
                <a class="btn" th:href="@{/loans}">取消</a>
            </div>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
