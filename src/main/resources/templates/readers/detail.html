<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/layout :: head(${reader.name})}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('readers')}"></header>
<main class="container">
    <div class="page-head">
        <div>
            <h1 th:text="${reader.name}">读者</h1>
            <p class="hint" th:text="|借书证号 ${reader.cardNo}|"></p>
        </div>
        <div class="page-actions">
            <a class="btn" th:href="@{/readers/{id}/edit(id=${reader.id})}">编辑</a>
            <a class="btn ghost" th:href="@{/readers}">返回读者列表</a>
        </div>
    </div>

    <div class="alert ok" th:if="${msg}" th:text="${msg}"></div>
    <div class="alert err" th:if="${error}" th:text="${error}"></div>

    <div class="card">
        <div class="info-grid">
            <div class="info-item">
                <span class="label">借书证号</span>
                <span class="value" th:text="${reader.cardNo}"></span>
            </div>
            <div class="info-item">
                <span class="label">电话</span>
                <span class="value" th:text="${reader.phone ?: '—'}"></span>
            </div>
            <div class="info-item">
                <span class="label">状态</span>
                <span class="value">
                    <span class="badge" th:classappend="${reader.active} ? ' ok' : ' muted'"
                          th:text="${reader.active} ? '正常' : '停用'"></span>
                </span>
            </div>
            <div class="info-item">
                <span class="label">借阅上限</span>
                <span class="value" th:text="${reader.maxBorrow}"></span>
            </div>
            <div class="info-item">
                <span class="label">已在借 / 剩余可借</span>
                <span class="value" th:text="|${activeCount} / ${remaining}|"></span>
            </div>
            <div class="info-item">
                <span class="label">登记时间</span>
                <span class="value" th:text="${reader.createdAtText}"></span>
            </div>
        </div>
        <div class="form-actions" style="margin-top:18px">
            <a class="btn primary" th:href="@{/loans/new(readerId=${reader.id})}"
               th:if="${reader.active and remaining > 0}">给这位读者借书</a>
            <span class="hint" th:if="${!reader.active}">读者已停用，不能借书。</span>
            <span class="hint" th:if="${reader.active and remaining == 0}">已达借阅上限，请先归还部分图书。</span>
        </div>
    </div>

    <h2 class="section-title" th:text="|在借中（${#lists.size(activeLoans)}）|">在借中</h2>
    <table class="table">
        <thead>
        <tr>
            <th>图书</th>
            <th>借出时间</th>
            <th>应还时间</th>
            <th>状态</th>
            <th class="actions">操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="loan : ${activeLoans}">
            <td>
                <a th:href="@{/books/{id}(id=${loan.book.id})}" th:text="${loan.book.title}"></a>
            </td>
            <td th:text="${loan.borrowedAtText}"></td>
            <td th:text="${loan.dueAtText}"></td>
            <td>
                <span class="badge warn" th:if="${loan.overdue}" th:text="|逾期 ${loan.overdueDays} 天|"></span>
                <span class="badge" th:unless="${loan.overdue}">在借</span>
            </td>
            <td class="actions">
                <form class="inline" method="post" th:action="@{/loans/{id}/return(id=${loan.id})}">
                    <input type="hidden" name="returnTo" th:value="|/readers/${reader.id}|">
                    <button class="btn sm" type="submit">还书</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(activeLoans)}">
            <td colspan="5" class="empty">这位读者当前没有在借图书。</td>
        </tr>
        </tbody>
    </table>

    <h2 class="section-title" th:text="|借阅历史（${history.totalElements} 条）|">借阅历史</h2>
    <table class="table">
        <thead>
        <tr>
            <th>图书</th>
            <th>借出时间</th>
            <th>应还时间</th>
            <th>归还时间</th>
            <th>状态</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="loan : ${history.content}">
            <td>
                <a th:href="@{/books/{id}(id=${loan.book.id})}" th:text="${loan.book.title}"></a>
            </td>
            <td th:text="${loan.borrowedAtText}"></td>
            <td th:text="${loan.dueAtText}"></td>
            <td th:text="${loan.returnedAtText}"></td>
            <td>
                <span class="badge ok" th:if="${!loan.overdue}">按时归还</span>
                <span class="badge warn" th:if="${loan.overdue}" th:text="|逾期归还 ${loan.overdueDays} 天|"></span>
            </td>
        </tr>
        <tr th:if="${history.totalElements == 0}">
            <td colspan="5" class="empty">还没有归还记录。</td>
        </tr>
        </tbody>
    </table>

    <div class="pager" th:if="${history.totalPages > 1}">
        <a class="btn sm" th:if="${history.hasPrevious}"
           th:href="@{/readers/{id}(id=${reader.id},page=${history.number - 1})}">上一页</a>
        <span th:text="|第 ${history.number + 1} / ${history.totalPages} 页，共 ${history.totalElements} 条|"></span>
        <a class="btn sm" th:if="${history.hasNext}"
           th:href="@{/readers/{id}(id=${reader.id},page=${history.number + 1})}">下一页</a>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
