spring:
  application:
    name: library-system
  datasource:
    url: jdbc:sqlite:data/library.db?busy_timeout=5000&journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  thymeleaf:
    cache: false

server:
  port: 8080

library:
  loan:
    period-days: 30
  admin:
    username: admin
    password: admin123
  seed:
    # 首次启动时导入 40 本示例图书（只执行一次，已有图书按 ISBN 去重保留）
    books: true
    # 首次启动时导入 6 位示例读者与 13 条借阅记录（含在借、已归还、逾期）
    demo-loans: true
